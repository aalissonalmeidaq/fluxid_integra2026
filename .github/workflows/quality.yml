name: Qualidade e Gates Automatizados

on:
  push:
    branches: ['main', 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  qualidade:
    name: Verificação de Qualidade (Spec 001)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalação reproduzível de dependências
        run: npm ci

      - name: Verificação estática de tipos (TypeScript)
        run: npm run typecheck

      - name: Análise de código e estilo (ESLint)
        run: npm run lint

      - name: Testes unitários, contrato e integração
        run: npm run test

      - name: Cobertura mínima de testes (Vitest)
        run: npm run test:coverage

      - name: Instalar binários do Playwright (Chromium e WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Testes E2E, responsividade, acessibilidade e PWA (Playwright, larguras de 360, 768 e 1920 px)
        run: npm run test:e2e

      - name: Build de produção da aplicação e PWA
        run: npm run build

      - name: Build do catálogo do design system (fora do pacote de produção)
        run: npm run catalogo:build

      - name: Confirmar que o pacote de produção não contém o catálogo
        run: |
          if grep -rIl "Catálogo do design system" dist; then
            echo "O catálogo não pode estar em dist/." >&2
            exit 1
          fi

  visual:
    name: Regressão visual (Spec 003, somente Chromium no Linux)
    runs-on: ubuntu-latest
    # Linha de base aprovada em 01/10/2026 (T078 da Spec 003): a comparação das capturas bloqueia regressões.

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalação reproduzível de dependências
        run: npm ci

      - name: Instalar só o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Comparar as capturas de referência (telas e catálogo)
        run: npm run test:visual

      - name: Guardar o relatório e as capturas geradas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regressao-visual
          path: |
            playwright-report/
            test-results/
            tests/e2e/visual/**/*-snapshots/
          if-no-files-found: ignore

  supabase:
    name: Banco, RLS e Edge Functions (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalação reproduzível de dependências
        run: npm ci

      - name: Gerar o segredo local da limpeza de retenção (aleatório, mascarado e não versionado)
        run: |
          SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$SECRET"
          echo "RETENTION_JOB_SECRET=$SECRET" > supabase/.env
          echo "RETENTION_JOB_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Gerar chaves VAPID descartáveis para as notificações dos lacres (Spec 012; mascaradas e não versionadas)
        run: |
          read -r PUBLICA PRIVADA <<< "$(node -e "const c=require('node:crypto');const j=c.generateKeyPairSync('ec',{namedCurve:'P-256'}).privateKey.export({format:'jwk'});console.log(Buffer.concat([Buffer.from([4]),Buffer.from(j.x,'base64url'),Buffer.from(j.y,'base64url')]).toString('base64url'),j.d)")"
          echo "::add-mask::$PRIVADA"
          {
            echo "VAPID_PUBLIC_KEY=$PUBLICA"
            echo "VAPID_PRIVATE_KEY=$PRIVADA"
            echo "VAPID_SUBJECT=mailto:ci@fluxid.invalid"
            # Spec 015 (US6): avisos por e-mail só com o provedor falso; nenhum provedor real foi escolhido.
            echo "EMAIL_PROVIDER=fake"
          } > supabase/functions/.env

      - name: Subir o Supabase local (migrations, seed sintético e Edge Functions)
        run: npx supabase start

      - name: Testes SQL e políticas RLS com dois tenants (pgTAP)
        run: npx supabase test db

      - name: Expor somente URL e chave publicável locais aos testes
        run: |
          STATUS="$(npx supabase status -o json)"
          echo "VITE_SUPABASE_LOCAL_URL=$(echo "$STATUS" | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_LOCAL_PUBLISHABLE_KEY=$(echo "$STATUS" | jq -r .PUBLISHABLE_KEY)" >> "$GITHUB_ENV"

      - name: Testes de contrato e integração ao vivo (Auth, sessões, MFA, RLS e Edge Functions)
        run: npm run test:live

      - name: Encerrar o Supabase local
        if: always()
        run: npx supabase stop --no-backup

  firmware:
    name: Firmware do lacre (Specs 012 e 013)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Reprovar segredos dentro de firmware/
        run: |
          if git ls-files --error-unmatch firmware/include/secrets.h >/dev/null 2>&1; then
            echo "firmware/include/secrets.h não pode ser versionado." >&2
            exit 1
          fi
          if grep -rIEn 'fxk_[A-Za-z0-9_-]{20,}|[a-z0-9]{20}\.supabase\.co|sb_secret_|-----BEGIN [A-Z ]*PRIVATE KEY-----' firmware; then
            echo "firmware/ contém chave, endereço real do Supabase ou chave privada." >&2
            exit 1
          fi
          # Spec 013 (RF-019, RN-006): a senha do portal só existe no secrets.h local e no Vault; nenhuma rede fica compilada.
          if grep -rIEn 'FLUXID_PORTAL_SENHA[[:space:]]+"' firmware | grep -v '"<senha-da-rede-de-configuracao>"'; then
            echo "firmware/ contém um valor real em FLUXID_PORTAL_SENHA." >&2
            exit 1
          fi
          if grep -rIEn 'FLUXID_REDE_FABRICA_SENHA[[:space:]]+"' firmware | grep -v '"<senha-da-rede-padrao>"'; then
            echo "firmware/ contém um valor real em FLUXID_REDE_FABRICA_SENHA." >&2
            exit 1
          fi
          if grep -rIEn 'FLUXID_WIFI_(SSID|SENHA)' firmware/src; then
            echo "firmware/src não pode usar FLUXID_WIFI_SSID nem FLUXID_WIFI_SENHA: a rede principal vem do portal." >&2
            exit 1
          fi

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reaproveitar plataformas e bibliotecas do PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Instalar o PlatformIO
        run: pip install platformio==6.1.16

      - name: Testes das regras do firmware no computador (Unity)
        run: pio test -d firmware -e native

      - name: Compilar o firmware do ESP32-C3 (com o modelo de segredos)
        run: pio run -d firmware -e esp32c3
