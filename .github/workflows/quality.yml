name: Qualidade e Gates Automatizados

on:
  push:
    branches: ['main', 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  qualidade:
    name: Verificação de Qualidade (Spec 001)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalação reproduzível de dependências
        run: npm ci

      - name: Verificação estática de tipos (TypeScript)
        run: npm run typecheck

      - name: Análise de código e estilo (ESLint)
        run: npm run lint

      - name: Testes unitários, contrato e integração
        run: npm run test

      - name: Cobertura mínima de testes (Vitest)
        run: npm run test:coverage

      - name: Instalar binários do Playwright (Chromium e WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Testes E2E, responsividade, acessibilidade e PWA (Playwright)
        run: npm run test:e2e

      - name: Build de produção da aplicação e PWA
        run: npm run build
