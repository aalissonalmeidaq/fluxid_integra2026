name: Validar registro de IA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  governanca-ia:
    name: Governança de IA por ciclo
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar registro do ciclo
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governanca-ia/validar-registro-ia.mjs --base "$BASE_SHA"
