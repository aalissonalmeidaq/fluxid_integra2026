; Firmware do lacre FluxID (Spec 012, research.md, item 16). Dois ambientes:
;   esp32c3  o lacre de verdade (ESP32-C3 Super Mini, compativel com a esp32-c3-devkitm-1), so Wi-Fi, HTTPS
;   native   os testes das regras puras (src/nucleo) no computador, com Unity
; Segredos (chave do dispositivo, rede padrao, endereco do FluxID) ficam em include/secrets.h, fora do git.

[platformio]
default_envs = esp32c3

[comum]
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -std=gnu++17
    -DARDUINOJSON_USE_DOUBLE=1
    -DARDUINOJSON_USE_LONG_LONG=1

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
; Raizes do Mozilla para conferir o certificado do FluxID (ferramentas/gerar_pacote_certificados.py).
board_build.embed_files = certificados/x509_crt_bundle.bin
monitor_speed = 115200
lib_deps =
    ${comum.lib_deps}
    mikalhart/TinyGPSPlus@1.1.0
build_unflags = -std=gnu++11
build_flags =
    ${comum.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Os testes so rodam no computador; o lacre so compila.
test_ignore = *

[env:native]
platform = native
lib_deps = ${comum.lib_deps}
build_flags =
    ${comum.build_flags}
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE
    -DFLUXID_EXEMPLOS=\"../tests/fixtures/seal-protocol\"
; Testes usam so as regras puras: nada de Arduino.h, Wi-Fi ou flash.
build_src_filter = +<nucleo/>
test_build_src = yes
