    <script>
      // Spec 011: na landing ("/" no navegador), o mascote da abertura é o maior elemento da primeira tela (LCP). A busca começa aqui, junto
      // com o JavaScript, em vez de esperar a página montar. Só na landing: as outras rotas e o PWA instalado não baixam a imagem.
      // O conjunto e os tamanhos são os mesmos do componente Mascote (uso "abertura"); o teste de metadados confere que batem.
      if (location.pathname === '/' && !matchMedia('(display-mode: standalone)').matches) {
        var mascote = document.createElement('link');
        mascote.rel = 'preload';
        mascote.as = 'image';
        mascote.type = 'image/webp';
        mascote.setAttribute('imagesrcset', '/landing/mascote-cilindro-400.webp 400w, /landing/mascote-cilindro-749.webp 749w');
        mascote.setAttribute('imagesizes', '(min-width: 1024px) 26rem, 18rem');
        mascote.setAttribute('fetchpriority', 'high');
        document.head.appendChild(mascote);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
